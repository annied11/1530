<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pitt Club Events Viewer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <h1>Pitt Club Events</h1>
    <div class="controls">
      <label>
        Search
        <input
          id="search"
          type="search"
          placeholder="Search by event name or organization"
          autocomplete="off"
        />
      </label>
      <label>
        Organization
        <select id="org-filter">
          <option value="">All organizations</option>
        </select>
      </label>
      <label>
        Category
        <select id="category-filter">
          <option value="">All categories</option>
        </select>
      </label>
    </div>
    <p id="status">Loading events…</p>
    <ul id="events"></ul>
  </div>

  <script>

    function icsUrl(event) {
      const d = new Date(event.date);
      const pad = (n) => String(n).padStart(2, "0");

      const dt =
        d.getUTCFullYear().toString() +
        pad(d.getUTCMonth() + 1) +
        pad(d.getUTCDate()) +
        "T" +
        pad(d.getUTCHours()) +
        pad(d.getUTCMinutes()) +
        pad(d.getUTCSeconds()) +
        "Z";

      const summary = event.name || "Pitt Club Event";
      const location = event.location || "";
      const description = event.organization
        ? `Hosted by ${event.organization}`
        : "";

      const ics = `
BEGIN:VCALENDAR
VERSION:2.0
BEGIN:VEVENT
DTSTART:${dt}
SUMMARY:${summary}
LOCATION:${location}
DESCRIPTION:${description}
END:VEVENT
END:VCALENDAR`;

      return URL.createObjectURL(
        new Blob([ics], { type: "text/calendar" })
      );
    }

    function fileName(str) {
      return (
        (str || "event")
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, "-") + ".ics"
      );
    }

    // old code

    async function fetchFromOrigins(origins) {
      const errors = [];

      for (const origin of origins) {
        try {
          const response = await fetch(`${origin}/events/`);
          if (!response.ok) {
            errors.push(`${origin} responded with status ${response.status}`);
            continue;
          }
          return response.json();
        } catch (error) {
          errors.push(`${origin} unreachable: ${error}`);
        }
      }

      const message =
        "No backend origins responded. Tried: " + errors.join("; ");
      throw new Error(message);
    }

    function renderEvents(events, totalCount) {
      const list = document.getElementById("events");
      const status = document.getElementById("status");
      list.innerHTML = "";

      if (!events.length) {
        status.textContent =
          "No events match your search or filters. Try adjusting them.";
        return;
      }

      status.textContent = `${events.length} of ${totalCount} event${
        totalCount === 1 ? "" : "s"
      } shown:`;

      events.forEach((event) => {
        const formattedTime = new Intl.DateTimeFormat([], {
          dateStyle: "medium",
          timeStyle: "short",
        }).format(new Date(event.date));

        const item = document.createElement("li");
        item.innerHTML = `
            <details>
              <summary>
                <span class=\"title\">${event.name}</span>
                <time class=\"event-time\">${formattedTime}</time>
              </summary>
              <div class=\"details-body\">
                <p><strong>Organization:</strong> ${event.organization}</p>
                <p><strong>Location:</strong> ${event.location}</p>
                <p><strong>Category:</strong> ${event.category}</p>
                <p>
                  <a href=\"${icsUrl(event)}\" download=\"${fileName(
          event.name
        )}\">Add to calendar</a>
                </p>
              </div>
            </details>
          `;
        list.appendChild(item);
      });
    }

    function populateFilters(events) {
      const orgSelect = document.getElementById("org-filter");
      const categorySelect = document.getElementById("category-filter");

      const organizations = Array.from(
        new Set(events.map((event) => event.organization).filter(Boolean))
      ).sort();
      const categories = Array.from(
        new Set(events.map((event) => event.category).filter(Boolean))
      ).sort();

      organizations.forEach((org) => {
        const option = document.createElement("option");
        option.value = org;
        option.textContent = org;
        orgSelect.appendChild(option);
      });

      categories.forEach((category) => {
        const option = document.createElement("option");
        option.value = category;
        option.textContent = category;
        categorySelect.appendChild(option);
      });
    }

    function setupFilters(allEvents) {
      const searchInput = document.getElementById("search");
      const orgSelect = document.getElementById("org-filter");
      const categorySelect = document.getElementById("category-filter");

      const applyFilters = () => {
        const searchTerm = searchInput.value.trim().toLowerCase();
        const orgFilter = orgSelect.value;
        const categoryFilter = categorySelect.value;

        const filtered = allEvents.filter((event) => {
          const matchesOrg = orgFilter ? event.organization === orgFilter : true;
          const matchesCategory = categoryFilter
            ? event.category === categoryFilter
            : true;
          const matchesSearch = searchTerm
            ? [event.name, event.organization]
                .filter(Boolean)
                .some((field) =>
                  field.toLowerCase().includes(searchTerm)
                )
            : true;

          return matchesOrg && matchesCategory && matchesSearch;
        });

        renderEvents(filtered, allEvents.length);
      };

      [searchInput, orgSelect, categorySelect].forEach((input) => {
        input.addEventListener("input", applyFilters);
        input.addEventListener("change", applyFilters);
      });

      applyFilters();
    }

    async function loadEvents() {
      const status = document.getElementById("status");
      const origins = [];

      const currentOrigin = window.location.origin;
      if (currentOrigin && currentOrigin.startsWith("http")) {
        origins.push(currentOrigin);
      }

      origins.push(
        "http://127.0.0.1:8000",
        "http://localhost:8000",
        "http://0.0.0.0:8000",
        "https://127.0.0.1:8000",
        "https://localhost:8000"
      );

      try {
        const events = await fetchFromOrigins(origins);
        if (!events.length) {
          status.textContent = "No events found.";
          return;
        }

        populateFilters(events);
        setupFilters(events);
      } catch (error) {
        console.error(error);
        status.textContent =
          "Unable to load events. Make sure the Django server is running on 127.0.0.1:8000 or localhost:8000. " +
          "If you're using a different host or port, update the page URL accordingly. Details: " +
          error.message;
      }
    }

    loadEvents();
  </script>
</body>
</html>
